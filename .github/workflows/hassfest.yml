name: Hassfest

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  hassfest:
    runs-on: truenas-ha-xsense-home-storage-8g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out trusted validator adapter
        uses: actions/checkout@v4
        with:
          path: .ci/trusted-adapter
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Prepare disk dependency cache
        run: ci-cache downloads
      - name: Set up Python for Hassfest
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"
      - name: Set up isolated Hassfest BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Register Hassfest problem matcher
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.ci/trusted-adapter/.github/scripts/hassfest-problem-matcher.json"
      - name: Hassfest validation
        run: bash .ci/trusted-adapter/.github/scripts/ha-validators.sh hassfest
