name: CI artifact janitor

on:
  workflow_run:
    # Replace this with the complete, explicit list of upstream workflow display names.
    # Never include "CI artifact janitor" in the list.
    workflows:
      - "HACS"
      - "Hassfest"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: truenas-ha-xsense-home-storage-8g
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch janitor code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's default branch is the trusted source. Never use the completed
          # workflow's head_sha or download/execute its contents.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python for bounded retention cleanup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Remove non-retained artifacts from the completed run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python3 .github/scripts/cleanup-actions-artifacts.py
          --run-id "$TARGET_RUN_ID"
